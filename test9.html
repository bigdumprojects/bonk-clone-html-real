<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Arena Arena Pro - Last Standing</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d0d11; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #gameContainer {
            position: relative; width: 800px; height: 600px;
            background: #1e1e24; border: 4px solid #3a3a4a; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-radius: 8px; overflow: hidden;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a24 0%, #0b0b0f 100%); z-index: 10;
        }
        .hidden { display: none !important; }
        button {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; 
            padding: 14px 35px; margin: 10px; font-size: 16px; font-weight: bold; border-radius: 25px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6); }
        input, select {
            padding: 12px; margin: 10px; border-radius: 6px; border: 1px solid #444;
            background: #252530; color: white; font-size: 16px; width: 220px; text-align: center;
        }
        label { font-size: 13px; font-weight: 600; margin-top: 8px; color: #a4a4c1; text-transform: uppercase; letter-spacing: 1px; }
        canvas { background: #141419; display: block; }
        
        /* Stylized Dynamic Cutscene Overlays */
        #cutsceneOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 14, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 5;
            backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s ease;
        }
        #cutsceneOverlay.active { opacity: 1; }
        
        #cutsceneText { 
            font-size: 50px; font-weight: 900; color: #fff; 
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,71,87,0.8), 0 0 40px rgba(255,71,87,0.4);
            animation: textPulse 1.5s infinite alternate;
            text-align: center; max-width: 90%;
        }
        #countdownText { 
            font-size: 96px; font-weight: 900; color: #f1c40f; 
            text-shadow: 0 0 25px rgba(241,196,15,0.7);
            transform: scale(0.5); animation: countZoom 1s infinite ease-out;
        }
        @keyframes textPulse {
            0% { transform: scale(0.95); filter: brightness(0.9); }
            100% { transform: scale(1.03); filter: brightness(1.2); }
        }
        @keyframes countZoom {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        #gameHUD {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
            font-size: 16px; font-weight: bold; z-index: 4; letter-spacing: 0.5px;
        }
        .hud-card {
            background: rgba(25, 25, 35, 0.75); padding: 8px 16px; 
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- HUD -->
    <div id="gameHUD" class="hidden">
        <div id="scoreDisplay" class="hud-card">Red: 0 | Blue: 0</div>
        <div id="mapDisplay" class="hud-card">Map: Loading...</div>
    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="screen">
        <h1 style="font-size: 52px; font-weight: 900; letter-spacing: 3px; margin-bottom: 30px; background: linear-gradient(45deg, #ff4757, #ff9f43); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PHYSICS ARENA</h1>
        <button id="btnQuickMatch">Quick Match</button>
        <button id="btnCreateRoomMenu">Create Room</button>
    </div>

    <!-- CREATE ROOM MENU -->
    <div id="roomMenu" class="screen hidden">
        <h2 style="font-size: 28px; margin-bottom: 20px; letter-spacing: 1px;">Lobby Configuration</h2>
        <input type="text" id="roomName" value="Pro Arena Room">
        
        <label>Game Mode</label>
        <select id="teamMode">
            <option value="ffa">Free For All (FFA)</option>
            <option value="teams">Teams (Red vs Blue)</option>
        </select>
        
        <label>Number of Bots</label>
        <select id="botCount">
            <option value="1">1 Bot</option>
            <option value="2">2 Bots</option>
            <option value="3">3 Bots</option>
            <option value="4">4 Bots</option>
        </select>
        
        <button id="btnStartGame">Launch Lobby</button>
        <button id="btnBack" style="background: #3f3f4e; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">Back</button>
    </div>

    <!-- CUTSCENE & COUNTDOWN OVERLAY -->
    <div id="cutsceneOverlay" class="hidden">
        <div id="cutsceneText">ROUND ONE</div>
        <div id="countdownText">3</div>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Element Selectors
    const mainMenu = document.getElementById('mainMenu');
    const roomMenu = document.getElementById('roomMenu');
    const gameHUD = document.getElementById('gameHUD');
    const cutsceneOverlay = document.getElementById('cutsceneOverlay');
    const cutsceneText = document.getElementById('cutsceneText');
    const countdownText = document.getElementById('countdownText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const mapDisplay = document.getElementById('mapDisplay');

    // State Variables
    let gameActive = false;
    let inCutscene = false;
    let isTeams = false;
    let maxBots = 1;
    let currentMapIndex = 0;
    let scores = { red: 0, blue: 0, player: 0, bot1: 0, bot2: 0, bot3: 0, bot4: 0 };
    const keys = {};

    // Physics Constants
    const gravity = 0.15;
    const friction = 0.98;

    // Entities Registry Array
    let entities = [];

    // Map Database Setup
    const maps = [
        {
            name: "The Chasm",
            platforms: [
                {x: 200, y: 450, w: 400, h: 30, type: "normal"},
                {x: 50, y: 320, w: 110, h: 20, type: "bounce"},
                {x: 640, y: 320, w: 110, h: 20, type: "bounce"}
            ]
        },
        {
            name: "Pillar Fortress",
            platforms: [
                {x: 80, y: 490, w: 180, h: 30, type: "normal"},
                {x: 540, y: 490, w: 180, h: 30, type: "normal"},
                {x: 310, y: 330, w: 180, h: 20, type: "bounce"},
                {x: 200, y: 190, w: 110, h: 20, type: "normal"},
                {x: 490, y: 190, w: 110, h: 20, type: "normal"}
            ]
        },
        {
            name: "Hazard Arena",
            platforms: [
                {x: 150, y: 420, w: 500, h: 25, type: "normal"},
                {x: 280, y: 240, w: 240, h: 20, type: "bounce"},
                {x: 380, y: 530, w: 40, h: 40, type: "bounce"}
            ]
        }
    ];

    // Inputs Management
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Menu Navigation System
    document.getElementById('btnQuickMatch').addEventListener('click', () => {
        isTeams = Math.random() > 0.5;
        maxBots = Math.floor(Math.random() * 3) + 1;
        initGame();
    });

    document.getElementById('btnCreateRoomMenu').addEventListener('click', () => {
        mainMenu.classList.add('hidden');
        roomMenu.classList.remove('hidden');
    });

    document.getElementById('btnBack').addEventListener('click', () => {
        roomMenu.classList.add('hidden');
        mainMenu.classList.remove('hidden');
    });

    document.getElementById('btnStartGame').addEventListener('click', () => {
        isTeams = document.getElementById('teamMode').value === 'teams';
        maxBots = parseInt(document.getElementById('botCount').value);
        roomMenu.classList.add('hidden');
        initGame();
    });

    function initGame() {
        mainMenu.classList.add('hidden');
        gameHUD.classList.remove('hidden');
        gameActive = true;
        currentMapIndex = 0;
        scores = { red: 0, blue: 0, player: 0, bot1: 0, bot2: 0, bot3: 0, bot4: 0 };
        setupRound();
    }

    function setupRound() {
        inCutscene = true;
        cutsceneOverlay.classList.remove('hidden');
        cutsceneOverlay.classList.add('active');
        cutsceneText.innerText = "ROUND STARTING";
        countdownText.style.animation = 'none';
        
        entities = [];
        
        // Player Definition
        entities.push({
            id: 'player', isBot: false, team: isTeams ? 'red' : 'player', name: 'Player', alive: true,
            x: 250, y: 200, vx: 0, vy: 0, radius: 16,
            speed: 0.28, baseMass: 1, heavyMass: 4, mass: 1,
            color: isTeams ? '#ff4757' : '#54a0ff', inAir: true, isSlamming: false
        });

        // Dynamic Bot Spawning
        for(let i = 1; i <= maxBots; i++) {
            let botTeam = isTeams ? (i % 2 === 0 ? 'red' : 'blue') : 'bot' + i;
            entities.push({
                id: 'bot' + i, isBot: true, team: botTeam, name: 'Bot ' + i, alive: true,
                x: 350 + (i * 60), y: 200, vx: 0, vy: 0, radius: 16,
                speed: 0.24, baseMass: 1, heavyMass: 4, mass: 1,
                color: isTeams ? (botTeam === 'red' ? '#ff4757' : '#1e90ff') : '#ff9f43',
                inAir: true, isSlamming: false, targetX: 400, aiTimer: 0
            });
        }

        updateHUDTexts();
        runCountdown(3);
    }

    function runCountdown(count) {
        if(count > 0) {
            countdownText.innerText = count;
            countdownText.style.animation = 'none';
            void countdownText.offsetWidth; // Restart animations cleanly
            countdownText.style.animation = 'countZoom 1s ease-out';
            setTimeout(() => runCountdown(count - 1), 1000);
        } else {
            countdownText.innerText = "GO!";
            countdownText.style.animation = 'none';
            void countdownText.offsetWidth;
            countdownText.style.animation = 'countZoom 0.6s ease-out';
            setTimeout(() => {
                cutsceneOverlay.classList.remove('active');
                setTimeout(() => {
                    cutsceneOverlay.classList.add('hidden');
                    inCutscene = false;
                }, 200);
            }, 600);
        }
    }

    function updateHUDTexts() {
        mapDisplay.innerText = "🏟️ Map: " + maps[currentMapIndex].name;
        if (isTeams) {
            scoreDisplay.innerText = `🔴 Red Team: ${scores.red}  |  🔵 Blue Team: ${scores.blue}`;
        } else {
            let leaderboard = entities.map(e => {
                let s = e.id === 'player' ? scores.player : (scores[e.id] || 0);
                return `${e.name}: ${s}`;
            }).join('  |  ');
            scoreDisplay.innerText = leaderboard;
        }
    }

    function checkRoundEndConditions() {
        if (inCutscene) return;

        if (isTeams) {
            let redAlive = entities.some(e => e.team === 'red' && e.alive);
            let blueAlive = entities.some(e => e.team === 'blue' && e.alive);
            
            if (!redAlive || !blueAlive) {
                inCutscene = true;
                let winnerText = "Draw Match!";
                if (redAlive) { scores.red++; winnerText = "Red Team Wins Round!"; }
                if (blueAlive) { scores.blue++; winnerText = "Blue Team Wins Round!"; }
                triggerRoundEndCutscene(winnerText);
            }
        } else {
            let aliveEntities = entities.filter(e => e.alive);
            
            if (aliveEntities.length <= 1) {
                inCutscene = true;
                let winnerText = "No One Survived!";
                if (aliveEntities.length === 1) {
                    let winner = aliveEntities[0];
                    if (winner.id === 'player') scores.player++;
                    else scores[winner.id] = (scores[winner.id] || 0) + 1;
                    winnerText = `${winner.name} Wins the Round!`;
                }
                triggerRoundEndCutscene(winnerText);
            }
        }
    }

    function triggerRoundEndCutscene(text) {
        cutsceneText.innerText = text;
        countdownText.innerText = "";
        cutsceneOverlay.classList.remove('hidden');
        void cutsceneOverlay.offsetWidth;
        cutsceneOverlay.classList.add('active');

        setTimeout(() => {
            currentMapIndex = (currentMapIndex + 1) % maps.length;
            setupRound();
        }, 2500);
    }

    function processAI(bot) {
        bot.aiTimer--;
        if(bot.aiTimer <= 0) {
            let closestTarget = null;
            let closestDist = Infinity;

            entities.forEach(ent => {
                if (ent.id !== bot.id && ent.alive) {
                    if (!isTeams || (isTeams && ent.team !== bot.team)) {
                        let d = Math.hypot(ent.x - bot.x, ent.y - bot.y);
                        if (d < closestDist) {
                            closestDist = d;
                            closestTarget = ent;
                        }
                    }
                }
            });

            if (closestTarget) bot.targetX = closestTarget.x;
            bot.aiTimer = Math.floor(Math.random() * 15) + 5;
        }

        if (bot.x < bot.targetX - 8) bot.vx += bot.speed;
        if (bot.x > bot.targetX + 8) bot.vx -= bot.speed;

        if (bot.inAir && Math.random() < 0.015 && !bot.isSlamming) {
            bot.isSlamming = true; 
        }
        if (!bot.inAir && Math.random() < 0.04) {
            bot.vy = -5.5; bot.inAir = true;
        }
    }

    function updatePhysics() {
        const currentMap = maps[currentMapIndex];

        entities.forEach(ent => {
            if (!ent.alive) return; // Completely skip calculation loop for eliminated entries

            if (!ent.isBot) {
                if (keys['arrowleft'] || keys['a']) ent.vx -= ent.speed;
                if (keys['arrowright'] || keys['d']) ent.vx += ent.speed;
                if ((keys['arrowup'] || keys['w']) && !ent.inAir) {
                    ent.vy = -5.8;
                    ent.inAir = true;
                }
                
                if (keys[' '] || keys['spacebar']) {
                    if (ent.inAir) {
                        ent.isSlamming = true;
                        ent.mass = ent.heavyMass;
                        ent.vy += 0.12; // Less aggressive slam speed
                    } else {
                        ent.mass = ent.heavyMass; 
                    }
                } else {
                    ent.mass = ent.baseMass;
                    ent.isSlamming = false;
                }
            } else {
                processAI(ent);
                if (ent.isSlamming) {
                    ent.mass = ent.heavyMass;
                    ent.vy += 0.12;
                } else {
                    ent.mass = ent.baseMass;
                }
            }

            ent.vy += gravity * ent.mass;
            ent.vx *= friction;
            ent.vy *= friction;
            ent.x += ent.vx;
            ent.y += ent.vy;

            let touchGround = false;
            currentMap.platforms.forEach(plat => {
                if (ent.x + ent.radius > plat.x && ent.x - ent.radius < plat.x + plat.w &&
                    ent.y + ent.radius > plat.y && ent.y - ent.radius < plat.y + plat.h) {
                    
                    if (ent.vy > 0 && ent.y < plat.y + 12) {
                        ent.y = plat.y - ent.radius;
                        
                        if (ent.isSlamming) {
                            ent.vy = -9.8; // Increased slam deflection bounce vector (Bounces higher than before)
                            ent.isSlamming = false;
                            ent.inAir = true;
                            touchGround = true;
                        } else {
                            ent.vy *= (plat.type === "bounce") ? -1.35 : -0.25;
                            ent.isSlamming = false;
                        }
                    }
                    if(!ent.isSlamming) touchGround = true;
                }
            });

            if(touchGround) ent.inAir = false;
            else ent.inAir = true;

            // Elimination conditions
            if (ent.y > canvas.height + 40 || ent.x < -40 || ent.x > canvas.width + 40) {
                ent.alive = false;
                updateHUDTexts();
                checkRoundEndConditions();
            }
        });

        // Sphere Collision Calculations between surviving elements
        for (let i = 0; i < entities.length; i++) {
            for (let j = i + 1; j < entities.length; j++) {
                let e1 = entities[i]; let e2 = entities[j];
                if (!e1.alive || !e2.alive) continue;

                let dx = e2.x - e1.x; let dy = e2.y - e1.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let minDist = e1.radius + e2.radius;

                if (dist < minDist) {
                    let overlap = minDist - dist;
                    let nx = dx / dist; let ny = dy / dist;
                    e1.x -= nx * overlap * 0.5; e1.y -= ny * overlap * 0.5;
                    e2.x += nx * overlap * 0.5; e2.y += ny * overlap * 0.5;

                    let kx = e1.vx - e2.vx; let ky = e1.vy - e2.vy;
                    let p = 2 * (nx * kx + ny * ky) / (e1.mass + e2.mass);
                    e1.vx -= p * e2.mass * nx; e1.vy -= p * e2.mass * ny;
                    e2.vx += p * e1.mass * nx; e2.vy += p * e1.mass * ny;
                }
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const currentMap = maps[currentMapIndex];

        currentMap.platforms.forEach(plat => {
            ctx.fillStyle = plat.type === "bounce" ? "#ff9f43" : "#2ed573";
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        });

        entities.forEach(ent => {
            if (!ent.alive) return; // Do not draw dead players/bots

            ctx.beginPath();
            ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
            ctx.fillStyle = ent.color;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            if (ent.mass > ent.baseMass) {
                ctx.beginPath();
                ctx.arc(ent.x, ent.y, ent.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#22222b';
                ctx.fill();
            }
        });
    }

    function mainLoop() {
        if (gameActive) {
            if (!inCutscene) {
                updatePhysics();
            }
            render();
        }
        requestAnimationFrame(mainLoop);
    }

    mainLoop();
</script>
</body>
</html>
