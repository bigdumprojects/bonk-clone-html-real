<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Physics Arena Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #333;
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Physics Arena</h2>
        <p>Use <b>Arrow Keys</b> or <b>WASD</b> to move. Press <b>Spacebar</b> to become heavy.</p>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Keyboard State
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Player Object
        const player = {
            x: 400,
            y: 200,
            vx: 0,
            vy: 0,
            radius: 20,
            baseMass: 1,
            heavyMass: 5,
            mass: 1,
            color: '#ff4757',
            speed: 0.5,
            isHeavy: false
        };

        // Environment Variables
        const gravity = 0.2;
        const friction = 0.98;

        // Static Platforms (x, y, width, height)
        const platforms = [
            { x: 150, y: 450, width: 500, height: 40 },
            { x: 100, y: 300, width: 150, height: 20 },
            { x: 550, y: 300, width: 150, height: 20 }
        ];

        function update() {
            // Heavy Mechanic (Increases mass and alters appearance)
            if (keys[' '] || keys['spacebar']) {
                player.mass = player.heavyMass;
                player.isHeavy = true;
                player.color = '#ff6b81';
            } else {
                player.mass = player.baseMass;
                player.isHeavy = false;
                player.color = '#ff4757';
            }

            // Input Handling (Movement)
            if (keys['arrowleft'] || keys['a']) player.vx -= player.speed;
            if (keys['arrowright'] || keys['d']) player.vx += player.speed;
            if (keys['arrowup'] || keys['w']) {
                // Simple ground-check abstraction for jumping
                if (player.y + player.radius >= 445 && player.x > 130 && player.x < 670) {
                    player.vy = -7;
                }
            }

            // Apply Gravity
            player.vy += gravity * player.mass;

            // Apply Friction / Drag
            player.vx *= friction;
            player.vy *= friction;

            // Update Positions
            player.x += player.vx;
            player.y += player.vy;

            // Boundary Collision (Screen Limits)
            if (player.x - player.radius < 0) {
                player.x = player.radius;
                player.vx *= -0.6; 
            }
            if (player.x + player.radius > canvas.width) {
                player.x = canvas.width - player.radius;
                player.vx *= -0.6;
            }
            if (player.y - player.radius < 0) {
                player.y = player.radius;
                player.vy = 0;
            }

            // Platform Collisions (Basic AABB check against the main floor)
            platforms.forEach(plat => {
                if (player.x + player.radius > plat.x && 
                    player.x - player.radius < plat.x + plat.width &&
                    player.y + player.radius > plat.y && 
                    player.y - player.radius < plat.y + plat.height) {
                    
                    // Resolve collision from above
                    if (player.vy > 0 && player.y < plat.y + 10) {
                        player.y = plat.y - player.radius;
                        player.vy *= -0.4; // Bounce factor
                    }
                }
            });

            // Reset player if they fall off screen
            if (player.y > canvas.height + 100) {
                player.x = 400;
                player.y = 200;
                player.vx = 0;
                player.vy = 0;
            }
        }

        function draw() {
            // Clear Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#2ed573';
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            
            // Draw a heavy inner core if spacebar is active
            if (player.isHeavy) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#2f3542';
                ctx.fill();
            }
            ctx.closePath();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Game
        loop();
    </script>
</body>
</html>
