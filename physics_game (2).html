<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonk Clone - Evolution</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 4px;
            overflow: hidden;
        }
        canvas {
            background-color: #242530;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 21, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #ff4757;
            text-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }
        input {
            background: #2f3542;
            border: 2px solid #57606f;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        input:focus {
            border-color: #ff4757;
        }
        #lobbyList {
            width: 80%;
            max-height: 200px;
            background: #2f3542;
            border-radius: 8px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
        }
        .lobby-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #3f4452;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .lobby-item:hover {
            background: #57606f;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 120px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px #ff4757;
            pointer-events: none;
            z-index: 6;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.1); }
        }
        #cutsceneOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 71, 87, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 7;
            transition: all 0.5s ease;
        }
        .cutscene-banner {
            background: #1e1f29;
            color: #ffd32a;
            font-size: 48px;
            font-weight: 900;
            padding: 20px 60px;
            border-top: 5px solid #ffd32a;
            border-bottom: 5px solid #ffd32a;
            transform: rotate(-5deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .cutscene-sub {
            color: white;
            font-size: 20px;
            margin-top: 15px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div id="scoreDisplay">Player: 0 | Enemy: 0</div>
            <div id="mapDisplay">Map: Loading...</div>
        </div>

        <!-- Overlays -->
        <div id="countdownOverlay" class="hidden">3</div>
        <div id="cutsceneOverlay" class="hidden">
            <div class="cutscene-banner">
                POINT SCORED!
                <div class="cutscene-sub" id="cutsceneSubText">Player wins the round!</div>
            </div>
        </div>

        <!-- Screens -->
        <!-- Main Menu -->
        <div id="mainMenu" class="screen">
            <h1>BONK ARENA</h1>
            <input type="text" id="username" value="Player" maxlength="12">
            <button onclick="changeScreen('lobbyBrowser')">Play Game</button>
        </div>

        <!-- Lobby Browser -->
        <div id="lobbyBrowser" class="screen class hidden">
            <h1>Lobbies</h1>
            <div id="lobbyList">
                <div class="lobby-item" onclick="changeScreen('stagingRoom')">
                    <span>🔴 Pro Physics Room #1</span>
                    <span>1/8 Players</span>
                </div>
                <div class="lobby-item" onclick="changeScreen('stagingRoom')">
                    <span>🟢 Casual Bouncing Room #4</span>
                    <span>3/8 Players</span>
                </div>
            </div>
            <button onclick="changeScreen('stagingRoom')">Quick Match</button>
            <button onclick="changeScreen('mainMenu')">Back</button>
        </div>

        <!-- Staging Room -->
        <div id="stagingRoom" class="screen hidden">
            <h1>Staging Area</h1>
            <p>Waiting for host to start...</p>
            <button onclick="startGame()">Start Simulation</button>
            <button onclick="changeScreen('lobbyBrowser')">Leave</button>
        </div>

        <!-- Canvas Frame -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // States
        let gameState = 'menu'; // menu, countdown, playing, cutscene
        let currentMapIndex = 0;
        let countdownVal = 3;
        let playerScore = 0;
        let enemyScore = 0;

        // Input
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Entities
        const player = {
            x: 200, y: 300, vx: 0, vy: 0, radius: 18,
            baseMass: 1, heavyMass: 6, mass: 1,
            speed: 0.28, // LOWERED SPEED AS REQUESTED
            isHeavy: false, color: '#ff4757'
        };

        const enemy = {
            x: 600, y: 300, vx: 0, vy: 0, radius: 18,
            baseMass: 1, heavyMass: 6, mass: 1,
            speed: 0.25, isHeavy: false, color: '#1e90ff',
            targetX: 600, targetY: 300
        };

        const environment = { gravity: 0.18, friction: 0.97 };

        // Maps Definition
        const maps = [
            {
                name: "Classic Grid",
                deathZoneY: 570,
                platforms: [
                    { x: 100, y: 450, width: 600, height: 40, color: '#2ed573' },
                    { x: 250, y: 300, width: 300, height: 20, color: '#ffa502' }
                ]
            },
            {
                name: "The Pillars",
                deathZoneY: 570,
                platforms: [
                    { x: 50, y: 500, width: 200, height: 50, color: '#1289A7' },
                    { x: 550, y: 500, width: 200, height: 50, color: '#1289A7' },
                    { x: 325, y: 380, width: 150, height: 30, color: '#D980FA' },
                    { x: 100, y: 220, width: 120, height: 20, color: '#2ed573' },
                    { x: 580, y: 220, width: 120, height: 20, color: '#2ed573' }
                ]
            },
            {
                name: "Chasm Void",
                deathZoneY: 570,
                platforms: [
                    { x: 0, y: 400, width: 220, height: 200, color: '#747d8c' },
                    { x: 580, y: 400, width: 220, height: 200, color: '#747d8c' },
                    { x: 300, y: 250, width: 200, height: 25, color: '#ff6b81' }
                ]
            }
        ];

        // Screen Routing
        function changeScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('hud').classList.add('hidden');
            
            if(screenId !== 'game') {
                document.getElementById(screenId).classList.remove('hidden');
            } else {
                document.getElementById('hud').classList.remove('hidden');
            }
        }

        function startGame() {
            changeScreen('game');
            playerScore = 0;
            enemyScore = 0;
            currentMapIndex = 0;
            updateHUD();
            startRoundCountdown();
        }

        function startRoundCountdown() {
            gameState = 'countdown';
            countdownVal = 3;
            resetPositions();
            
            const overlay = document.getElementById('countdownOverlay');
            overlay.classList.remove('hidden');
            overlay.innerText = countdownVal;
            
            document.getElementById('mapDisplay').innerText = `Map: ${maps[currentMapIndex].name}`;

            const interval = setInterval(() => {
                countdownVal--;
                if(countdownVal > 0) {
                    overlay.innerText = countdownVal;
                } else if(countdownVal === 0) {
                    overlay.innerText = "GO!";
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    gameState = 'playing';
                }
            }, 800);
        }

        function resetPositions() {
            player.x = 200; player.y = 250; player.vx = 0; player.vy = 0;
            enemy.x = 600, enemy.y = 250; enemy.vx = 0; enemy.vy = 0;
        }

        function updateHUD() {
            const pName = document.getElementById('username').value || "Player";
            document.getElementById('scoreDisplay').innerText = `${pName}: ${playerScore} | Enemy: ${enemyScore}`;
        }

        function triggerScoreCutscene(winner) {
            gameState = 'cutscene';
            const overlay = document.getElementById('cutsceneOverlay');
            const subtext = document.getElementById('cutsceneSubText');
            
            const pName = document.getElementById('username').value || "Player";
            if (winner === 'player') {
                playerScore++;
                subtext.innerText = `${pName} scores and dominates the field!`;
            } else {
                enemyScore++;
                subtext.innerText = `Enemy scores with tactical mass!`;
            }
            
            updateHUD();
            overlay.classList.remove('hidden');

            // Map switching logic upon next round creation
            currentMapIndex = (currentMapIndex + 1) % maps.length;

            setTimeout(() => {
                overlay.classList.add('hidden');
                startRoundCountdown();
            }, 2500);
        }

        // Vector Circle Collisions
        function resolveCircleCollision(c1, c2) {
            let dx = c2.x - c1.x;
            let dy = c2.y - c1.y;
            let distance = Math.hypot(dx, dy);
            let minDist = c1.radius + c2.radius;

            if (distance < minDist) {
                let overlap = minDist - distance;
                let nx = dx / distance;
                let ny = dy / distance;

                // Push apart
                c1.x -= nx * overlap * 0.5;
                c1.y -= ny * overlap * 0.5;
                c2.x += nx * overlap * 0.5;
                c2.y += ny * overlap * 0.5;

                // Momentum Exchange
                let kx = c1.vx - c2.vx;
                let ky = c1.vy - c2.vy;
                let p = 2 * (nx * kx + ny * ky) / (c1.mass + c2.mass);

                c1.vx -= p * c2.mass * nx;
                c1.vy -= p * c2.mass * ny;
                c2.vx += p * c1.mass * nx;
                c2.vy += p * c1.mass * ny;
            }
        }

        function update() {
            if (gameState !== 'playing' && gameState !== 'cutscene') return;

            const currentMap = maps[currentMapIndex];

            if (gameState === 'playing') {
                // Player Control Logic (Heavy Modifier)
                if (keys[' '] || keys['spacebar']) {
                    player.mass = player.heavyMass;
                    player.isHeavy = true;
                    player.color = '#ff6b81';
                } else {
                    player.mass = player.baseMass;
                    player.isHeavy = false;
                    player.color = '#ff4757';
                }

                if (keys['arrowleft'] || keys['a']) player.vx -= player.speed;
                if (keys['arrowright'] || keys['d']) player.vx += player.speed;
                if (keys['arrowup'] || keys['w']) {
                    // Quick platform verification logic to jump
                    currentMap.platforms.forEach(plat => {
                        if (player.x + player.radius > plat.x && player.x - player.radius < plat.x + plat.width &&
                            Math.abs((player.y + player.radius) - plat.y) < 6) {
                            player.vy = -6.5;
                        }
                    });
                }

                // AI Opponent Strategy Tracking
                if (Math.random() < 0.15) {
                    enemy.targetX = player.x;
                    enemy.isHeavy = (player.isHeavy && Math.hypot(player.x - enemy.x, player.y - enemy.y) < 120);
                }

                if (enemy.isHeavy) {
                    enemy.mass = enemy.heavyMass;
                    enemy.color = '#2980b9';
                } else {
                    enemy.mass = enemy.baseMass;
                    enemy.color = '#1e90ff';
                }

                if (enemy.x < enemy.targetX - 20) enemy.vx += enemy.speed;
                if (enemy.x > enemy.targetX + 20) enemy.vx -= enemy.speed;
                
                // Random jumps for AI stability
                if (Math.random() < 0.02) {
                    currentMap.platforms.forEach(plat => {
                        if (enemy.x + enemy.radius > plat.x && enemy.x - enemy.radius < plat.x + plat.width &&
                            Math.abs((enemy.y + enemy.radius) - plat.y) < 6) {
                            enemy.vy = -6.5;
                        }
                    });
                }
            }

            // Apply Environment Forces
            [player, enemy].forEach(ent => {
                ent.vy += environment.gravity * ent.mass;
                ent.vx *= environment.friction;
                ent.vy *= environment.friction;
                ent.x += ent.vx;
                ent.y += ent.vy;

                // Screen Horizontal Hard Bounds
                if (ent.x - ent.radius < 0) { ent.x = ent.radius; ent.vx *= -0.5; }
                if (ent.x + ent.radius > canvas.width) { ent.x = canvas.width - ent.radius; ent.vx *= -0.5; }

                // Platform Interaction Pass
                currentMap.platforms.forEach(plat => {
                    if (ent.x + ent.radius > plat.x && ent.x - ent.radius < plat.x + plat.width &&
                        ent.y + ent.radius > plat.y && ent.y - ent.radius < plat.y + plat.height) {
                        
                        if (ent.vy > 0 && ent.y < plat.y + 12) {
                            ent.y = plat.y - ent.radius;
                            ent.vy *= -0.3; 
                        }
                    }
                });
            });

            // Handle Interactions
            resolveCircleCollision(player, enemy);

            // Elimination / Score triggers
            if (gameState === 'playing') {
                if (player.y > currentMap.deathZoneY) {
                    triggerScoreCutscene('enemy');
                } else if (enemy.y > currentMap.deathZoneY) {
                    triggerScoreCutscene('player');
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentMap = maps[currentMapIndex];

            // Render Arena Structure
            currentMap.platforms.forEach(plat => {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#1e1f29';
                ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
            });

            // Draw Players
            [player, enemy].forEach(ent => {
                ctx.beginPath();
                ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
                ctx.fillStyle = ent.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                if (ent.isHeavy) {
                    ctx.beginPath();
                    ctx.arc(ent.x, ent.y, ent.radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#1e1f29';
                    ctx.fill();
                }
            });

            // Decorative Death Boundaries
            ctx.fillStyle = 'rgba(255, 71, 87, 0.4)';
            ctx.fillRect(0, currentMap.deathZoneY, canvas.width, canvas.height - currentMap.deathZoneY);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
