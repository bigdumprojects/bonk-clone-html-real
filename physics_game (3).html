<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Arena Sandbox</title>
    <style>
        body { margin: 0; padding: 0; background: #222; font-family: Arial, sans-serif; color: #fff; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #menu, #lobby, #game { background: #333; padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 800px; box-sizing: border-box; }
        .hidden { display: none !important; }
        button { background: #2ed573; border: none; padding: 10px 20px; color: #fff; font-size: 16px; border-radius: 4px; cursor: pointer; margin: 10px; }
        button:hover { background: #26af5f; }
        input, select { padding: 10px; width: 200px; border-radius: 4px; border: 1px solid #555; background: #444; color: #fff; font-size: 16px; margin: 10px; }
        canvas { background: #111; display: block; margin: 20px auto; border: 2px solid #555; }
        #overlay { position: absolute; width: 800px; height: 500px; display: flex; justify-content: center; align-items: center; font-size: 48px; font-weight: bold; background: rgba(0,0,0,0.6); pointer-events: none; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menu">
        <h1>PHYSICS ARENA</h1>
        <input type="text" id="roomNameInput" value="My Epic Room"><br>
        <label>Bots: </label>
        <select id="botCountSelect">
            <option value="1">1 Bot</option>
            <option value="2">2 Bots</option>
            <option value="3" selected>3 Bots</option>
            <option value="4">4 Bots</option>
        </select><br>
        <button id="createRoomBtn">Create & Start Room</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game" class="hidden" style="position: relative;">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="overlay" class="hidden">3</div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        let players = [];
        let platforms = [];
        let currentMapIdx = 0;
        let gameState = 'menu'; // menu, countdown, playing, cutscene
        let timer = 0;
        let botCount = 3;

        const maps = [
            {
                name: "THE CHASM",
                platforms: [
                    { x: 0, y: 460, w: 250, h: 40, bounce: false },
                    { x: 550, y: 460, w: 250, h: 40, bounce: false },
                    { x: 300, y: 320, w: 200, h: 20, bounce: true } // Bouncy mid
                ]
            },
            {
                name: "PILLAR FORTRESS",
                platforms: [
                    { x: 100, y: 400, w: 150, h: 100, bounce: false },
                    { x: 550, y: 400, w: 150, h: 100, bounce: false },
                    { x: 325, y: 250, w: 150, h: 30, bounce: false }
                ]
            },
            {
                name: "HAZARD ARENA",
                platforms: [
                    { x: 50, y: 450, w: 700, h: 30, bounce: false },
                    { x: 200, y: 280, w: 150, h: 20, bounce: true },
                    { x: 450, y: 280, w: 150, h: 20, bounce: true }
                ]
            }
        ];

        document.getElementById('createRoomBtn').addEventListener('click', () => {
            botCount = parseInt(document.getElementById('botCountSelect').value);
            menu.classList.add('hidden');
            game.classList.remove('hidden');
            initGame();
        });

        function initGame() {
            players = [];
            // Human player
            players.push({
                x: 200, y: 200, vx: 0, vy: 0, r: 16, mass: 1, 
                color: '#ff4757', isBot: false, score: 0, inAir: true
            });
            // Bots
            for(let i=0; i<botCount; i++) {
                players.push({
                    x: 400 + (i * 50), y: 200, vx: 0, vy: 0, r: 16, mass: 1, 
                    color: '#3498db', isBot: true, score: 0, inAir: true
                });
            }
            currentMapIdx = 0;
            startRound();
        }

        function startRound() {
            platforms = maps[currentMapIdx].platforms;
            players.forEach((p, idx) => {
                p.x = idx === 0 ? 150 : 500 + (idx * 40);
                p.y = 200;
                p.vx = 0; p.vy = 0; p.mass = 1; p.inAir = true;
            });
            gameState = 'countdown';
            timer = 180; // 3 seconds at 60fps
            overlay.classList.remove('hidden');
        }

        function triggerCutscene(winnerLabel) {
            gameState = 'cutscene';
            timer = 120; // 2 seconds
            overlay.innerText = winnerLabel + " SCORED!";
            overlay.classList.remove('hidden');
        }

        function update() {
            if (gameState === 'countdown') {
                timer--;
                overlay.innerText = Math.ceil(timer / 60);
                if (timer <= 0) {
                    gameState = 'playing';
                    overlay.classList.add('hidden');
                }
            } else if (gameState === 'cutscene') {
                timer--;
                if (timer <= 0) {
                    currentMapIdx = (currentMapIdx + 1) % maps.length;
                    startRound();
                }
            } else if (gameState === 'playing') {
                // Control human
                let p = players[0];
                let moveSpeed = 0.25; // Lowered player speed

                if (keys['arrowleft'] || keys['a']) p.vx -= moveSpeed;
                if (keys['arrowright'] || keys['d']) p.vx += moveSpeed;
                if ((keys['arrowup'] || keys['w']) && !p.inAir) {
                    p.vy = -6;
                    p.inAir = true;
                }

                // Heavy / Slam mechanic
                if (keys[' '] || keys['spacebar']) {
                    if (p.inAir) {
                        p.vy += 1.5; // Slam down if in air
                    }
                    p.mass = 4;
                } else {
                    p.mass = 1;
                }

                // AI Logic & Player Movement Loop
                players.forEach((player, index) => {
                    if (player.isBot) {
                        // Dumb bot behavior: chase human player
                        if (player.x < players[0].x) player.vx += 0.2;
                        else player.vx -= 0.2;
                        if (!player.inAir && Math.random() < 0.02) {
                            player.vy = -6;
                            player.inAir = true;
                        }
                    }

                    // Physics execution
                    player.vy += 0.2; // Gravity
                    player.vx *= 0.98; // Friction
                    player.vy *= 0.98;

                    player.x += player.vx;
                    player.y += player.vy;

                    // Out of bounds checking (Scoring)
                    if (player.y > canvas.height + 50 || player.x < -50 || player.x > canvas.width + 50) {
                        if (players.length > 1) {
                            // Find someone who survived to give credit to
                            if (index === 0) {
                                triggerCutscene("BOTS");
                            } else {
                                triggerCutscene("PLAYER 1");
                            }
                        } else {
                            startRound();
                        }
                    }

                    // Platform collisions
                    player.inAir = true;
                    platforms.forEach(plat => {
                        if (player.x + player.r > plat.x && player.x - player.r < plat.x + plat.w &&
                            player.y + player.r > plat.y && player.y - player.r < plat.y + plat.h) {
                            
                            // Top collision
                            if (player.vy > 0 && player.y < plat.y + 15) {
                                player.y = plat.y - player.r;
                                player.vy = plat.bounce ? -8 : 0;
                                player.inAir = false;
                            }
                        }
                    });

                    // Screen wall bounce
                    if (player.x - player.r < 0) { player.x = player.r; player.vx *= -0.5; }
                    if (player.x + player.r > canvas.width) { player.x = canvas.width - player.r; player.vx *= -0.5; }
                });

                // Ball-to-ball collisions (Simulated highly basic elastic collision)
                for (let i = 0; i < players.length; i++) {
                    for (let j = i + 1; j < players.length; j++) {
                        let p1 = players[i];
                        let p2 = players[j];
                        let dx = p2.x - p1.x;
                        let dy = p2.y - p1.y;
                        let dist = Math.hypot(dx, dy);
                        let minDist = p1.r + p2.r;

                        if (dist < minDist) {
                            let angle = Math.atan2(dy, dx);
                            let targetX = p1.x + Math.cos(angle) * minDist;
                            let targetY = p1.y + Math.sin(angle) * minDist;
                            let ax = (targetX - p2.x) * 0.5;
                            let ay = (targetY - p2.y) * 0.5;

                            p1.vx -= ax * (p2.mass / p1.mass);
                            p1.vy -= ay * (p2.mass / p1.mass);
                            p2.vx += ax * (p1.mass / p2.mass);
                            p2.vy += ay * (p1.mass / p2.mass);
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw current Map info
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.font = "20px Arial";
            ctx.fillText(maps[currentMapIdx].name, 20, 30);

            // Draw platforms
            platforms.forEach(plat => {
                ctx.fillStyle = plat.bounce ? '#ff9f43' : '#2ed573';
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            });

            // Draw players
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                if (p.mass > 1) { // Visual cue for heavy slam
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#1e272e';
                    ctx.fill();
                }
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
